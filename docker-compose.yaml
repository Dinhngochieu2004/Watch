version: '3.8'

services:
    ollama:
        image: ollama/ollama
        container_name: ollama
        ports:
            - '11434:11434'
        volumes:
            - ollama_data:/root/.ollama
        restart: unless-stopped
        entrypoint: >
            sh -c "
              /bin/ollama serve & 
              sleep 2 && 
              /bin/ollama run GandalfBaum/llama3.2-claude3.7 && 
              tail -f /dev/null
            "

    backend:
        build: ./server
        container_name: backend
        restart: always
        expose:
            - '3000'
        volumes:
            - ./server:/server
        depends_on:
            - ollama
        command: sh -c "npm install && npm run dev"

    nginx:
        image: nginx:alpine
        container_name: nginx
        ports:
            - '80:80'
        volumes:
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
            - ./client/dist:/usr/share/nginx/html
        depends_on:
            - backend

volumes:
    ollama_data:
